name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: hustcer/setup-moonbit@v1.22
        with:
          version: '0.10.14+7d59c7ec9'
          core-version: '0.10.14+7d59c7ec9'
      - run: moon version --all
      - run: moon update
      - run: moon check --target js --deny-warn
      - run: moon fmt --check
      - run: moon info
      - run: git diff --exit-code -- '*.mbti'
      - run: node scripts/check-api.mjs
      - run: node scripts/source-audit.mjs --check --report work/source-audit.json
      - run: moon test --target js --deny-warn
      - run: moon test --target wasm-gc --deny-warn
      - run: moon test --target native --deny-warn
      - run: moon build --target js --release --deny-warn
      - run: node tests/cli.mjs
      - run: python -m pip install numpy==2.3.5 nibabel==5.3.2
      - run: python scripts/oracle.py --report work/oracle-report.json
      - run: python scripts/scenarios.py work/scenarios
      - run: python scripts/roi_acceptance.py work/roi-acceptance
      - run: python scripts/benchmark.py work/benchmark
      - run: moon package
      - run: moon -C examples/registry-consumer test --target js --deny-warn
      - run: moon -C examples/registry-consumer test --target wasm-gc --deny-warn
      - run: moon -C examples/registry-consumer test --target native --deny-warn
      - uses: actions/upload-artifact@v4
        with:
          name: moonnifti-${{ matrix.os }}
          path: |
            _build/js/release/build/cmd/moonnifti/moonnifti.js
            _build/publish/*.zip
            work/oracle-report.json
            work/scenarios/
            work/source-audit.json
            work/roi-acceptance/
            work/benchmark/summary.json
